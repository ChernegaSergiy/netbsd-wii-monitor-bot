[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:puppeteer-server]
command=node /app/puppeteer-server/puppeteer-server.js
directory=/app/puppeteer-server
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PUPPETEER_EXECUTABLE_PATH="/usr/bin/chromium"
priority=10
startsecs=3

[program:wiim-bot]
command=php /app/wiim.php
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startsecs=5
